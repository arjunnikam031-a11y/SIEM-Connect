<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIEM Connect | Student Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fc;
    color: #17233c;
}

header {
    background: #102447;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo h2 {
    font-size: 25px;
}

.logo p {
    font-size: 12px;
    margin-top: 5px;
    color: #cbd8ee;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
}

nav a:hover {
    color: #55c2ff;
}

.hero {
    min-height: 430px;
    padding: 90px 8%;
    background: linear-gradient(120deg, #102447, #1769aa);
    color: white;
    display: flex;
    align-items: center;
}

.hero-content {
    max-width: 700px;
}

.hero h1 {
    font-size: 43px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.btn {
    display: inline-block;
    padding: 13px 25px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    margin: 5px;
}

.student {
    background: white;
    color: #102447;
}

.admin {
    background: #16a3d8;
    color: white;
}

section {
    padding: 55px 8%;
    text-align: center;
}

section h2 {
    font-size: 30px;
    margin-bottom: 15px;
}

.services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    margin-top: 30px;
}

.card {
    background: white;
    padding: 28px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.card h3 {
    color: #14558d;
    margin-bottom: 12px;
}

.card p {
    color: #64748b;
    line-height: 1.6;
}

footer {
    background: #102447;
    color: white;
    text-align: center;
    padding: 22px;
    margin-top: 30px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        text-align: center;
    }

    nav a {
        margin: 8px;
        display: inline-block;
    }

    .hero h1 {
        font-size: 32px;
    }
}
.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.brand-mark {
    background: white;
    color: #102447;
    font-weight: bold;
    padding: 14px 10px;
    border-radius: 10px;
    font-size: 17px;
}

nav a {
    transition: 0.3s;
}

nav a:hover {
    color: #55c2ff;
}
</style>
</head>

<body>
    <header>
    <div class="logo">
        <div class="brand-mark">SIEM</div>
        <div>
            <h2>SIEM CONNECT</h2>
            <p>Sandip Institute of Engineering and Management, Nashik</p>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="student-login.html">Student Login</a>
        <a href="admin-login.html">Admin Login</a>
    </nav>
</header>
