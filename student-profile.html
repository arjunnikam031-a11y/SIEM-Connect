<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory | SIEM Nashik</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .directory {
            max-width: 1200px;
            margin: 25px auto;
            padding: 20px;
            overflow-x: auto;
        }

        .search-box {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .student-table th,
        .student-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        .student-table th {
            background: #174a7e;
            color: white;
        }

        .student-table tr:nth-child(even) {
            background: #f2f6fa;
        }

        .student-table tr:hover {
            background: #e5effa;
        }

        .view-profile {
            display: inline-block;
            padding: 7px 12px;
            background: #174a7e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .view-profile:hover {
            background: #0e3155;
        }

        .back-link {
            display: inline-block;
            margin: 15px 10px 15px 0;
        }
    </style>
</head>

<body data-role="student">

<header>
    <h1>Sandip Foundation</h1>
    <p>College Students Services and Information Portal</p>
    <h2>Student Directory</h2>
</header>

<main class="directory">
    <h2>TYBCA Student List</h2>
    <p>Search students by roll number, PRN, name, or mobile number.</p>

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search students..."
        oninput="searchStudents()"
    >

    <p id="studentCount">Students Found: 43</p>

    <table class="student-table">
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>PRN</th>
                <th>Student Name</th>
                <th>Mobile No.</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <a class="back-link" href="student-dashboard.html">
        Back to Dashboard
    </a>
    <button type="button" onclick="logout()">Logout</button>
</main>

function displayStudents(list) {
    const table = document.getElementById("studentTable");
    table.innerHTML = "";

    list.forEach(student => {
        const row = document.createElement("tr");

        student.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        const profileLink = document.createElement("a");

        profileLink.textContent = "View Profile";
        profileLink.className = "view-profile";
        profileLink.href =
            "my-profile.html?prn=" +
            encodeURIComponent(student[1]);

        actionCell.appendChild(profileLink);
        row.appendChild(actionCell);
        table.appendChild(row);
    });

    document.getElementById("studentCount").textContent =
        "Students Found: " + list.length;
}

function searchStudents() {
    const query = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    const filtered = students.filter(student =>
        student.some(value =>
            String(value).toLowerCase().includes(query)
        )
    );

    displayStudents(filtered);
}
