<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Account Settings | SIEM Connect</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f6fb;color:#172554;min-height:100vh}
header{background:#102a56;color:white;padding:20px 7%;font-size:18px;font-weight:bold}
main{max-width:600px;margin:40px auto;padding:20px}
.card{background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px #0001}
h1{margin-bottom:10px}
p{color:#64748b;margin-bottom:20px;line-height:1.5}
label{display:block;margin:15px 0 7px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{width:100%;padding:14px;margin-top:22px;background:#102a56;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
a{display:inline-block;margin-top:20px;color:#2455a0}
#message{margin-top:15px;color:#166534}
.note{font-size:12px;margin-top:20px;color:#9a3412}
</style>
</head>
<body data-role="admin">
<header>SIEM Connect | Admin Settings</header>
<main>
<div class="card">
<h1>Change Admin ID & Password</h1>
<p>Enter your current credentials and create your new login details.</p>

<form id="adminSettingsForm">
<label>Current Admin ID</label>
<input id="currentAdminId" required>

<label>Current Password</label>
<input id="currentAdminPassword" type="password" required>

<label>New Admin ID</label>
<input id="newAdminId" required>

<label>New Password</label>
<input id="newAdminPassword" type="password" minlength="6" required>

<label>Confirm New Password</label>
<input id="confirmNewAdminPassword" type="password" minlength="6" required>

<button type="submit">Update Credentials</button>
<p id="message"></p>
</form>

<a href="admin-dashboard.html">← Back to Dashboard</a>
<p class="note">Demo project only: credentials are stored in this browser and are not secure for real administration.</p>
</div>
</main>

<script src="script.js"></script>
</body>
</html>
